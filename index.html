<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Шокопутти</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: linear-gradient(180deg, #ffd1e8 0%, #ffe8f3 50%, #fff5fa 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #score {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.85); padding: 8px 22px; border-radius: 30px;
    font-size: 20px; font-weight: 700; color: #d63384;
    box-shadow: 0 3px 12px rgba(214,51,132,0.2);
    z-index: 10; pointer-events: none;
  }

  /* ----- ДЕВОЧКА ----- */
  .girl {
    position: absolute; bottom: 0;
    width: 100px; height: 100px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18));
    line-height: 100px; text-align: center;
  }
  .girl img {
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center bottom;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  .girl #girlFallback { display: none; font-size: 70px; }

  /* ----- ГРУСТНАЯ ДЕВОЧКА ----- */
  #sadGirl {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 160px;
    width: auto;
    max-width: 60vw;
    object-fit: contain;
    z-index: 30;              /* выше оверлея (у него 20) */
    pointer-events: none;
    display: none;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  }
  #sadGirl.show { display: block; }

  /* ----- СЛАДОСТИ ----- */
  .item {
    position: absolute; font-size: 44px; line-height: 1;
    pointer-events: none; z-index: 4; will-change: transform;
  }

  /* ----- ОВЕРЛЕЙ ----- */
  #overlay {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; z-index: 20; padding: 20px; text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 26px; color: #d63384; line-height: 1.3; }
  #overlay p { font-size: 16px; color: #777; max-width: 300px; line-height: 1.5; }
  #startBtn {
    background: linear-gradient(135deg, #ff6fb5, #d63384);
    color: white; border: none; padding: 16px 44px;
    font-size: 20px; font-weight: 700; border-radius: 40px;
    box-shadow: 0 6px 18px rgba(214,51,132,0.4);
    cursor: pointer; touch-action: manipulation;
  }
  #startBtn:active { transform: scale(0.95); }
  .heart-pop {
    position: absolute; font-size: 32px; pointer-events: none; z-index: 15;
    animation: pop 0.7s ease-out forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -70px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="score">🍫 0</div>

  <div class="girl" id="girl">
    <img id="girlImg" alt="девочка">
    <span id="girlFallback">👧</span>
  </div>

  <!-- ГРУСТНАЯ ДЕВОЧКА -->
  <img id="sadGirl" alt="грустная девочка">

  <div id="overlay">
    <h1>👧Шокопутти🍫</h1>
    <p>Води пальцем по экрану — шокопутница бежит за ним. Лови шоколадки, булочки и конфеты!</p>
    <button id="startBtn" type="button">Шокопутить</button>
  </div>
</div>

<script>

const IMG_BASE  = '';
const IMG_CHEW1 = '';
const IMG_CHEW2 = '';
const IMG_SAD = '';

/* ---------- DOM ---------- */
const game     = document.getElementById('game');
const girl     = document.getElementById('girl');
const girlImg  = document.getElementById('girlImg');
const girlFall = document.getElementById('girlFallback');
const scoreEl  = document.getElementById('score');
const overlay  = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const sadGirl  = document.getElementById('sadGirl');

/* ---------- прелоад картинок ---------- */
[IMG_BASE, IMG_CHEW1, IMG_CHEW2, IMG_SAD].forEach(src => { const i = new Image(); i.src = src; });
girlImg.src = IMG_BASE;

/* fallback если картинки не загрузились */
girlImg.addEventListener('error', () => {
  console.warn('Картинка девочки не загрузилась, показываю эмодзи');
  girlImg.style.display = 'none';
  girlFall.style.display = 'inline';
});

/* ---------- РАЗМЕР ДЕВОЧКИ (должен совпадать с CSS .girl) ---------- */
const GIRL_WIDTH  = 100;
const GIRL_HEIGHT = 100;

/* ---------- АНИМАЦИЯ ЖЕВАНИЯ ---------- */
const CHEW_DELAY = 100;
const CHEW_CYCLES = 3;
let chewTimer = null;

function playChew() {
  if (chewTimer) { clearTimeout(chewTimer); chewTimer = null; }

  const seq = [];
  for (let c = 0; c < CHEW_CYCLES; c++) {
    seq.push(IMG_CHEW1);
    seq.push(IMG_CHEW2);
  }
  seq.push(IMG_BASE);

  let i = 0;
  function step() {
    girlImg.src = seq[i++];
    if (i >= seq.length) { chewTimer = null; return; }
    chewTimer = setTimeout(step, CHEW_DELAY);
  }
  step();
}

function stopChew() {
  if (chewTimer) { clearTimeout(chewTimer); chewTimer = null; }
  girlImg.src = IMG_BASE;
}

/* ---------- ИГРОВЫЕ ПЕРЕМЕННЫЕ ---------- */
const ITEMS = ['🍫', '🧁', '🍬', '🍩', '🍪', '🍭', '🥐'];

let girlX = window.innerWidth / 2;
let targetX = girlX;
let score = 0;
let running = false;
let items = [];
let lastTime = 0;
let spawnTimer = 0;
let spawnInterval = 900;
let speedBase = 0.18;

function setGirlX(x) {
  const half = GIRL_WIDTH / 2;
  girlX = Math.max(half, Math.min(window.innerWidth - half, x));
  girl.style.left = girlX + 'px';
}

/* ---------- УПРАВЛЕНИЕ ---------- */
function moveTo(clientX) { if (running) targetX = clientX; }

document.addEventListener('pointerdown', e => moveTo(e.clientX), { passive: true });
document.addEventListener('pointermove', e => moveTo(e.clientX), { passive: true });
document.addEventListener('touchstart',  e => { if (e.touches.length) moveTo(e.touches[0].clientX); }, { passive: true });
document.addEventListener('touchmove',   e => { if (e.touches.length) moveTo(e.touches[0].clientX); }, { passive: true });
document.addEventListener('mousemove',   e => moveTo(e.clientX));

/* ---------- СПАВН СЛАДОСТЕЙ ---------- */
function spawnItem() {
  const el = document.createElement('div');
  el.className = 'item';
  el.textContent = ITEMS[Math.floor(Math.random() * ITEMS.length)];
  const x = Math.random() * (window.innerWidth - 50) + 10;
  el.style.left = x + 'px';
  el.style.top = '0';
  game.appendChild(el);
  items.push({
    el, x, y: -60,
    speed: speedBase + Math.random() * 0.12,
    rot: 0,
    rotSpeed: (Math.random() - 0.5) * 0.15
  });
}

function popHeart(x, y) {
  const h = document.createElement('div');
  h.className = 'heart-pop';
  h.textContent = ['💖','✨','⭐'][Math.floor(Math.random()*3)];
  h.style.left = x + 'px';
  h.style.top = y + 'px';
  game.appendChild(h);
  setTimeout(() => h.remove(), 700);
}

/* ---------- СБРОС / КОНЕЦ ---------- */
function reset() {
  items.forEach(it => it.el.remove());
  items = [];
  score = 0;
  scoreEl.textContent = '🍫 0';
  spawnTimer = 0;
  speedBase = 0.18;
  spawnInterval = 900;
  stopChew();
  sadGirl.classList.remove('show');   // скрыть грустную
  setGirlX(window.innerWidth / 2);
  targetX = girlX;
}

function gameOver() {
  running = false;
  stopChew();

  // показать грустную девочку при < 50 очков
  if (score < 50 && IMG_SAD) {
    sadGirl.src = IMG_SAD;
    sadGirl.classList.add('show');
  } else {
    sadGirl.classList.remove('show');
  }

  overlay.innerHTML = `
    <h1>🍫 Собрано: ${score}</h1>
    <p>${score >= 500 ? 'Я в ахуе, я должен тебе шоколадку при предъявлении скрина.🍫' : score >= 300 ? 'О, миледи, это невозможно много! Щёки не устали?' : score >= 150 ? 'Я начинаю тебя бояться. Хотя лучше здесь, чем в жизни.' : score >= 50 ? 'Вот это да! Настоящая шокопутти!' : score >= 15 ? 'Хороший результат, а твоя мама меня не наругает?' : 'О, да ты на диете?'}</p>
    <button id="startBtn" type="button">Ещё раз</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('startBtn').addEventListener('click', start);
}

function start() {
  reset();
  overlay.classList.add('hidden');
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

/* ---------- ИГРОВОЙ ЦИКЛ ---------- */
function loop(t) {
  if (!running) return;
  const dt = Math.min(t - lastTime, 50);
  lastTime = t;

  const diff = targetX - girlX;
  girlX += diff * Math.min(1, dt * 0.018);
  setGirlX(girlX);

  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnItem();
    speedBase = Math.min(0.85, speedBase + 0.004);   // максимум 0.85
    spawnInterval = Math.max(380, spawnInterval - 8);
  }

  const girlTop   = window.innerHeight - GIRL_HEIGHT;
  const girlLeft  = girlX - GIRL_WIDTH / 2;
  const girlRight = girlX + GIRL_WIDTH / 2;

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed * dt;
    it.rot += it.rotSpeed * dt * 10;
    it.el.style.transform = `translateY(${it.y}px) rotate(${it.rot}deg)`;

    const itemX = it.x + 22;
    const itemY = it.y + 22;

    if (itemY > girlTop + 20 && itemY < girlTop + GIRL_HEIGHT &&
        itemX > girlLeft && itemX < girlRight) {
      popHeart(it.x + 22, it.y + 20);
      it.el.remove();
      items.splice(i, 1);
      score++;
      scoreEl.textContent = '🍫 ' + score;
      playChew();
      continue;
    }

    if (it.y > window.innerHeight) {
      it.el.remove();
      items.splice(i, 1);
      gameOver();
      return;
    }
  }

  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', start);
setGirlX(window.innerWidth / 2);
window.addEventListener('resize', () => setGirlX(girlX));
</script>
</body>
</html>
